<script>

function maskujKlawisze(AEvent, AMaska)
{
    if (window.Event) {
        kodKlawisza = AEvent.which;
    } else {
        kodKlawisza = AEvent.keyCode;
    }

    if (kodKlawisza == 13) {
        return true;  // Enter
    };

    if (kodKlawisza == 0) {
        return true;  // klawisze steruj±ce
    };
	
	if (kodKlawisza == 8) {
        return true;  // backspace
    };

    klawisz = String.fromCharCode(kodKlawisza);

    if (AMaska.indexOf(klawisz) == -1) {
        return false;
    } else {
        return true;
    }
}

function dop_zakr_min_sek(element){
   if(element.value>59){ alert('wartosc powinna miescic sie w przedziale 0 - 59'); element.value='00'; }
}


function walidacja_2cyfr(element)
{
  var wzor1 = /^[0-9]{1}$/;
  var wzor2 = /^[0-9]{2}$/;
  if(wzor1.test(element.value) == false){
   if(wzor2.test(element.value) == false){
     alert('Wpisz wartosc w poprawnym formacie tj. 14'); element.value = '00';    
  }}
}
