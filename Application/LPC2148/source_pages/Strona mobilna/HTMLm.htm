                icon: 'jqtouch.png',
                icon4: 'jqtouch4.png',
                addGlossToIcon: false,
                startupScreen: 'jqt_startup.png',
                statusBar: 'black-translucent',
                themeSelectionSelector: '#jqt #themes ul',
                preloadImages: []
            }); 

            $(function(){


                $('#swipeme').swipe(function(evt, data) {
                    var details = !data ? '': '<strong>' + data.direction + '/' + data.deltaX +':' + data.deltaY + '</strong>!';
                    $(this).html('You swiped ' + details );
                    $(this).parent().after('<li>swiped!</li>')
                });

                $('#tapme').tap(function(){
                    $(this).parent().after('<li>tapped!</li>')
                });

                $('a[target="_blank"]').bind('click', function() {
                    if (confirm('This link opens in a new window.')) {
                        return true;
                    } else {
                        return false;
                    }
                });

 
                $('#pageevents').
                    bind('pageAnimationStart', function(e, info){ 
                        $(this).find('.info').append('Started animating ' + info.direction + '&hellip;  And the link ' +
                            'had this custom data: ' + $(this).data('referrer').data('custom') + '<br>');
                    }).
                    bind('pageAnimationEnd', function(e, info){
                        $(this).find('.info').append('Finished animating ' + info.direction + '.<br><br>');

                    });
                

                $('#callback').bind('pageAnimationEnd', function(e, info){

                    if (!$(this).data('loaded')) {

                        $(this).append($('<div>Loading</div>').load('ajax.html .info', function() {        

                            $(this).parent().data('loaded', true);  
                        }));
                    }
                });

                $('#jqt').bind('turn', function(e, data){
                    $('#orient').html('Orientation: ' + data.orientation);
                });
                
            });    
           
        </script>

                text-align: center;
                background: #161618;  
            }
            div#jqt #about p {
                margin-bottom: 8px;
            }
            div#jqt #about a {
                color: #fff;                        
                font-weight: bold;
                text-decoration: none;
            }

/*jslint white: true, browser: true, undef: true, nomen: true, eqeqeq: true, plusplus: false, bitwise: true, regexp: true, strict: true, newcap: true, immed: true, maxerr: 14 */
/*global window: false */

/* enable strict mode */
"use strict";


// define functions
var set_scroll,
	my_scroll;


// if query string in URL contains scroll=nnn, then scroll position will be restored 
set_scroll = function () {
	// get query string parameter with "?"
	var search = window.location.search,
		matches;
	// if query string exists
	if (search) {
		// find scroll parameter in query string
		matches = /scroll=(\d+)/.exec(search);
		// jump to the scroll position if scroll parameter exists
		if (matches) {
			window.scrollTo(0, matches[1]);
		}
	}
};


// function appends scroll parameter to the URL or returns scroll value
my_scroll = function (url) {
	var scroll, q;
	// Netscape compliant
	if (typeof(window.pageYOffset) === 'number') {
		scroll = window.pageYOffset;
	}
	// DOM compliant
	else if (document.body && document.body.scrollTop) {
		scroll = document.body.scrollTop;
	}
	// IE6 standards compliant mode
	else if (document.documentElement && document.documentElement.scrollTop) {
		scroll = document.documentElement.scrollTop;
	}
	// needed for IE6 (when vertical scroll bar is on the top)
	else {
		scroll = 0;
	}
	// if input parameter does not exist then return scroll value
	if (url === undefined) {
		return scroll;
	}
	// else append scroll parameter to the URL
	else {
		// set "?" or "&" before scroll parameter
		q = url.indexOf('?') === -1 ? '?' : '&';
		// refresh page with scroll position parameter
		window.location.href = url + q + 'scroll=' + scroll;
	}
};


// add onload event listener
if (window.addEventListener) {
	window.addEventListener('load', set_scroll, false);
}
else if (window.attachEvent) {
	window.attachEvent('onload', set_scroll);
}



 function pageScroll() {
    	window.scrollBy(0,<%scrol%>); // horizontal and vertical scroll increments

          }
